appId: com.webkul.bagisto.mobikul
---
# Opens the seller dashboard from the shopper home page.
# Selector rule: label/key based only. No point or coordinate selectors.

- launchApp
- runFlow: dismiss_runtime_permissions.yaml

- extendedWaitUntil:
    visible:
      text: "^Home$"
    timeout: 30000

- tapOn:
    rightOf:
      text: "^bagisto$"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "^Marketplace$"
    timeout: 15000

- tapOn:
    text: "^(Seller sign in|Open dashboard)$"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1500

- runFlow:
    when:
      visible:
        text: "^Seller sign in$"
    commands:
      - tapOn:
          text: "^Email$"
      - eraseText
      - inputText: "ashifwebkul@gmail.com"
      - tapOn:
          text: "^Password$"
      - eraseText
      - inputText: "seller123"
      - tapOn:
          text: "^Sign in$"
          retryTapIfNoChange: true
          waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 30000
