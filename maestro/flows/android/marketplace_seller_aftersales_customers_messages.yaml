appId: com.webkul.bagisto.mobikul
name: Marketplace Seller - Aftersales, Customers and Messages (Android)
tags:
  - android
  - marketplace
  - seller
  - regression
---
# Covers vendor bookings, customers, reviews and inbox. Non-destructive only.

- runFlow: helpers/open_marketplace_seller_dashboard.yaml

- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "^Bookings$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^Bookings$"
    timeout: 20000
- assertVisible:
    text: "^(Filters|Calendar|List|All dates|Dates|No slots booked)$"
- tapOn:
    text: "^Filters$"
    waitToSettleTimeoutMs: 800
- assertVisible:
    text: "^(Order ID|Product ID|Booking ID|Quantity|From|To|Today|This week|This month|Last 3 months|Apply filters|Clear)$"
- tapOn:
    text: "^Clear$"
    waitToSettleTimeoutMs: 500
- runFlow:
    when:
      visible:
        text: "^Calendar$"
    commands:
      - tapOn:
          text: "^Calendar$"
          waitToSettleTimeoutMs: 800
      - assertVisible:
          text: "^(Calendar|List|No slots booked|All dates)$"
- runFlow:
    when:
      visible:
        text: "^List$"
    commands:
      - tapOn:
          text: "^List$"
          waitToSettleTimeoutMs: 800
      - assertVisible:
          text: "^(Calendar|List|No slots booked|All dates)$"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "^Customers$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^Customers$"
    timeout: 20000
- assertVisible:
    text: "^(Search by name or email|No customers yet|Spent with you|Orders|Active|Inactive)$"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "^Product reviews$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^Reviews$"
    timeout: 20000
- assertVisible:
    text: "(?s)^(On products|On your shop|No reviews yet).*"
- tapOn:
    text: "(?s)^On your shop.*"
    waitToSettleTimeoutMs: 800
- assertVisible:
    text: "(?s)^(On products|On your shop|No reviews yet|Published|Awaiting approval|Not published).*"
- tapOn:
    text: "(?s)^On products.*"
    waitToSettleTimeoutMs: 800
- assertVisible:
    text: "(?s)^(On products|On your shop|No reviews yet|Published|Awaiting approval|Not published).*"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      text: "^Messages$"
    direction: DOWN
    timeout: 8000
    speed: 40
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    text: "^Messages$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^Messages$"
    timeout: 20000
- assertVisible:
    text: "^(Marketplace admin|Customers|Search customers|No conversations yet)$"
- runFlow:
    when:
      visible:
        text: "^Customers$"
    commands:
      - tapOn:
          text: "^Customers$"
          waitToSettleTimeoutMs: 800
      - assertVisible:
          text: "^(Search customers|No conversations yet|Customers)$"
- runFlow:
    when:
      visible:
        text: "^Marketplace admin$"
    commands:
      - tapOn:
          text: "^Marketplace admin$"
          waitToSettleTimeoutMs: 800
      - assertVisible:
          text: "^(Marketplace admin|Write a message|No conversations yet|The marketplace has turned off replies\\.)$"
