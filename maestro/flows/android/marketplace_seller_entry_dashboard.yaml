appId: com.webkul.bagisto.mobikul
name: Marketplace Seller - Entry and Dashboard (Android)
tags:
  - android
  - marketplace
  - seller
  - smoke
---
# Starts from the shopper home screen, opens the marketplace seller area through
# the store icon, signs in if needed, and verifies the seller dashboard loads.
# Selector rule: label/key based only. No point or coordinate selectors.

- launchApp
- runFlow: helpers/dismiss_runtime_permissions.yaml

- extendedWaitUntil:
    visible:
      text: "^Home$"
    timeout: 30000

- tapOn:
    rightOf:
      text: "^bagisto$"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "^Marketplace$"
    timeout: 15000
- assertVisible:
    text: "(?s)^Sell on this marketplace.*"
- assertVisible:
    text: "^(Seller sign in|Open dashboard)$"

- tapOn:
    text: "^(Seller sign in|Open dashboard)$"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1500

- runFlow:
    when:
      visible:
        text: "^Seller sign in$"
    commands:
      - tapOn:
          text: "^Email$"
      - eraseText
      - inputText: "ashifwebkul@gmail.com"
      - tapOn:
          text: "^Password$"
      - eraseText
      - inputText: "seller123"
      - tapOn:
          text: "^Sign in$"
          retryTapIfNoChange: true
          waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 30000
- assertVisible:
    text: "^(Things to do|Performance|Orders by status|You are all caught up\\.)$"
