appId: com.webkul.bagisto.mobikul
name: Marketplace Seller - Products and Orders (Android)
tags:
  - android
  - marketplace
  - seller
  - regression
---
# Verifies the seller drawer can open the two main resident work areas:
# Products and Orders. Read-only smoke coverage only.
# Selector rule: label/key based only. No point or coordinate selectors.

- runFlow: helpers/open_marketplace_seller_dashboard.yaml

- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    text: "^Shop profile$"
- tapOn:
    text: "^Products$"
    waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "(?s)^Products.*"
    timeout: 20000
- assertVisible:
    text: "^(Search name or SKU|No products yet|No products match these filters|[0-9]+ products?)$"

- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "^Orders$"
    waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "(?s)^Orders.*"
    timeout: 20000
- assertVisible:
    text: "^(Order number, customer or status|No orders yet|[0-9]+ orders?)$"
