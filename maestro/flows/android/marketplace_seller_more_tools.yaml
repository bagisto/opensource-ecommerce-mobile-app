appId: com.webkul.bagisto.mobikul
name: Marketplace Seller - More Tools (Android)
tags:
  - android
  - marketplace
  - seller
  - regression
---
# Covers the vendor More Tools drawer pages. Non-destructive only.

- runFlow: helpers/open_marketplace_seller_dashboard.yaml

- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      text: "^Returns$"
    direction: DOWN
    timeout: 8000
    speed: 40
    visibilityPercentage: 10
    centerElement: false
- tapOn:
    text: "^Returns$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^Return requests$"
    timeout: 20000
- assertVisible:
    text: "^(Search by order, product or customer|No return requests)$"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      text: "^Courier collections$"
    direction: DOWN
    timeout: 8000
    speed: 40
    visibilityPercentage: 10
    centerElement: false
- tapOn:
    text: "^Courier collections$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^Collections$"
    timeout: 20000
- assertVisible:
    text: "^(No collections booked|Confirmation|[0-9]+ packages?)$"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      text: "^Sell an existing product$"
    direction: DOWN
    timeout: 12000
    speed: 60
    visibilityPercentage: 10
    centerElement: false
- tapOn:
    text: "^Sell an existing product$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^Sell yours$"
    timeout: 20000
- assertVisible:
    text: "^(Search the marketplace catalogue|Nothing here you can sell yet|Sell this|Lowest offer)$"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      text: "^Bulk pricing & stock$"
    direction: DOWN
    timeout: 12000
    speed: 60
    visibilityPercentage: 10
    centerElement: false
- tapOn:
    text: "^Bulk pricing & stock$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^Bulk edit$"
    timeout: 20000
- assertVisible:
    text: "^(Pricing|Stock|Search name or SKU|No results|[0-9]+ results?)$"
- runFlow:
    when:
      visible:
        text: "^Stock$"
    commands:
      - tapOn:
          text: "^Stock$"
          waitToSettleTimeoutMs: 800
      - assertVisible:
          text: "^(Stock|Quantity|Mode|Search name or SKU|No results|[0-9]+ results?)$"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      text: "^Bulk upload$"
    direction: DOWN
    timeout: 12000
    speed: 60
    visibilityPercentage: 10
    centerElement: false
- tapOn:
    text: "^Bulk upload$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^Bulk upload$"
    timeout: 20000
- assertVisible:
    text: "^(List your own products|Sell catalogue products|Past uploads|Starter spreadsheets|No uploads yet|Upload sheet)$"
- tapOn:
    text: "(?s)^List your own products.*"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      text: "^Source$"
    timeout: 10000
- assertVisible:
    text: "^(Spreadsheet|Images|Settings|Next|Back)$"
- back
