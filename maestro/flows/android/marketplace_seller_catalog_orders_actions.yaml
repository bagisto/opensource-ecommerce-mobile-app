appId: com.webkul.bagisto.mobikul
name: Marketplace Seller - Catalog and Orders Actions (Android)
tags:
  - android
  - marketplace
  - seller
  - regression
---
# Covers vendor catalogue/order pages plus non-destructive filters/create/detail entry.

- runFlow: helpers/open_marketplace_seller_dashboard.yaml

- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "^Products$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "(?s)^Products.*"
    timeout: 20000
- assertVisible:
    text: "^(Search name or SKU|Filters|New product|No products yet|No products match these filters|[0-9]+ products?)$"

- tapOn:
    text: "^Filters$"
    waitToSettleTimeoutMs: 800
- assertVisible:
    text: "^(Type|Status|Approval|Any|Apply|Clear all)$"
- tapOn:
    text: "^Clear all$"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      text: "(?s)^Products.*"
    timeout: 10000

- tapOn:
    text: "^New product$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "^New product$"
    timeout: 20000
- assertVisible:
    text: "^(SKU|Attribute family id|Save as draft|Create|Simple product|Downloadable|Virtual|Booking|Bundle|Grouped)$"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Products.*"
    timeout: 15000
- runFlow:
    when:
      visible:
        text: "(?s)^.+\\n.+\\n.*\\n.*\\n.*\\nYours$"
    commands:
      - tapOn:
          text: "(?s)^.+\\n.+\\n.*\\n.*\\n.*\\nYours$"
          waitToSettleTimeoutMs: 1500
      - extendedWaitUntil:
          visible:
            text: "^Product$"
          timeout: 20000
      - assertVisible:
          text: "^(Pricing|Stock by location|Categories|Description|SEO|Attributes|Edit)$"
      - tapOn:
          text: "^Edit$"
          waitToSettleTimeoutMs: 1500
      - extendedWaitUntil:
          visible:
            text: "^Edit product$"
          timeout: 20000
      - assertVisible:
          text: "(?s)^(General|Description|Price|Inventory|Images|Categories|SEO|More).*"
      - tapOn:
          text: "(?s)^Description.*"
          waitToSettleTimeoutMs: 700
      - assertVisible:
          text: "^(Short description|Full description|Description)$"
      - tapOn:
          text: "(?s)^Price.*"
          waitToSettleTimeoutMs: 700
      - assertVisible:
          text: "^(Pricing|Price|Special price)$"
      - tapOn:
          text: "(?s)^Inventory.*"
          waitToSettleTimeoutMs: 700
      - assertVisible:
          text: "(?s).*(STOCK BY LOCATION|Save).*"
      - back
      - back

- extendedWaitUntil:
    visible:
      text: "(?s)^Products.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "^Orders$"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "(?s)^Orders.*"
    timeout: 20000
- assertVisible:
    text: "^(Order number, customer or status|All|pending|processing|completed|No orders yet|[0-9]+ orders?)$"

- tapOn:
    text: "^Filter orders$"
    waitToSettleTimeoutMs: 800
- assertVisible:
    text: "^(Filter orders|Order status|Placed from|Placed to|Customer name|Customer email|Apply|Clear all)$"
- tapOn:
    text: "^Clear all$"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "^Apply$"
    optional: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      text: "(?s)^Orders.*"
    timeout: 15000
- tapOn:
    text: "^processing$"
    waitToSettleTimeoutMs: 800
- assertVisible:
    text: "^(processing|Order total|No orders yet)$"
- tapOn:
    text: "^All$"
    waitToSettleTimeoutMs: 1000

- extendedWaitUntil:
    visible:
      text: "(?s)^Orders.*"
    timeout: 15000
- runFlow:
    when:
      visible:
        text: "^All$"
    commands:
      - tapOn:
          text: "^All$"
          waitToSettleTimeoutMs: 1000

- extendedWaitUntil:
    visible:
      text: "(?s)^Orders.*"
    timeout: 15000
- runFlow:
    when:
      visible:
        text: "(?s)^#.+\\n.+\\n.+$"
    commands:
      - tapOn:
          text: "(?s)^#.+\\n.+\\n.+$"
          waitToSettleTimeoutMs: 1500
      - extendedWaitUntil:
          visible:
            text: "^Order$"
          timeout: 20000
      - assertVisible:
          text: "(?s)^(Information|Invoices|Shipments|Customer|Billing address|Shipping address).*"
      - tapOn:
          text: "(?s)^Information.*"
          waitToSettleTimeoutMs: 700
      - assertVisible:
          text: "(?s)^(Customer|Information|Payment method|Shipping method).*"
      - runFlow:
          when:
            visible:
              text: "(?s)^Invoices.*"
          commands:
            - tapOn:
                text: "(?s)^Invoices.*"
                waitToSettleTimeoutMs: 700
            - assertVisible:
                text: "(?s)^(Invoices|No invoices raised yet|Download invoice).*"
      - runFlow:
          when:
            visible:
              text: "(?s)^Shipments.*"
          commands:
            - tapOn:
                text: "(?s)^Shipments.*"
                waitToSettleTimeoutMs: 700
            - assertVisible:
                text: "(?s)^(Shipments|Nothing shipped yet|Carrier|Tracking number).*"
      - back
