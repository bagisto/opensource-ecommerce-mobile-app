appId: com.webkul.bagisto.mobikul
name: Marketplace Seller - Profile, Reviews and Earnings (Android)
tags:
  - android
  - marketplace
  - seller
  - regression
---
# Verifies read-only seller areas that live behind the seller drawer.
# Selector rule: label/key based only. No point or coordinate selectors.

- runFlow: helpers/open_marketplace_seller_dashboard.yaml

- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    text: "^Shop profile$"
- tapOn:
    text: "^Shop profile$"
    waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "(?s)^Shop profile.*"
    timeout: 20000
- assertVisible:
    text: "^(General|Shop logo|Business name|Contact name)$"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    text: "^Product reviews$"
- tapOn:
    text: "^Product reviews$"
    waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "(?s)^Reviews.*"
    timeout: 20000
- assertVisible:
    text: "(?s)^(On products|On your shop|No reviews yet).*"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    text: "^Shop reviews$"
- tapOn:
    text: "^Shop reviews$"
    waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "(?s)^Reviews.*"
    timeout: 20000
- assertVisible:
    text: "(?s)^(On products|On your shop|No reviews yet).*"
- back

- extendedWaitUntil:
    visible:
      text: "(?s)^Dashboard.*"
    timeout: 15000
- tapOn:
    text: "^Open navigation menu$"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    text: "^Earnings & payouts$"
- tapOn:
    text: "^Earnings & payouts$"
    waitToSettleTimeoutMs: 1500

- extendedWaitUntil:
    visible:
      text: "(?s)^Earnings.*"
    timeout: 20000
- assertVisible:
    text: "^(Total sales|Your share|Commission|Awaiting payout|Payout history|No payouts recorded yet)$"
